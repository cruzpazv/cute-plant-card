<!doctype html>
<!--
  Smoke test in a real browser (CI runs it in headless Chrome):
    google-chrome --headless=new --virtual-time-budget=5000 --dump-dom file://$PWD/tests/browser.html
  The <title> ends up PASS or FAIL and #result lists every check.
-->
<meta charset="utf-8">
<title>RUNNING</title>
<style>.cell { width: 128px; height: 120px; display: inline-block; margin: 4px; }</style>
<script>
  const out = [];
  const ok = (cond, msg) => out.push(`${cond ? "PASS" : "FAIL"} ${msg}`);
  addEventListener("error", (e) => out.push(`FAIL uncaught: ${e.message}`));
  addEventListener("unhandledrejection", (e) => out.push(`FAIL unhandled rejection: ${e.reason}`));
</script>
<script src="../dist/cute-plant-card.js"></script>
<body>
<script>
  const D = 864e5, now = Date.now();
  const hass = (days, extra = {}) => ({
    states: {
      "input_button.p": { state: new Date(now - days * D).toISOString(), attributes: {}, last_changed: new Date().toISOString() },
      "sensor.m": { state: "12", attributes: { device_class: "moisture", unit_of_measurement: "%" } },
      "sensor.t": { state: "31.2", attributes: { device_class: "temperature", unit_of_measurement: "°C" } },
      ...extra,
    },
    entities: {}, locale: { language: "en" }, calls: [],
    callService(...a) { this.calls.push(a); return Promise.resolve(); },
  });
  const mount = (config, h) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    const card = document.createElement("cute-plant-card");
    card.setConfig({ entity: "input_button.p", ...config });
    card.hass = h;
    cell.appendChild(card);
    document.body.appendChild(cell);
    return card;
  };

  // nothing visible in the top row overlaps, chips sit whole inside it, and the plant starts below
  const later = [];
  const topRow = (sr, tag) => {
    const row = sr.querySelector(".bubbles").getBoundingClientRect();
    const seen = (e) => getComputedStyle(e).visibility !== "hidden" && e.getBoundingClientRect().width > 0;
    const chips = [...sr.querySelectorAll(".bubble")].filter(seen).map((e) => e.getBoundingClientRect());
    const items = [...sr.querySelectorAll(".badges svg, .chip")].filter(seen).map((e) => e.getBoundingClientRect()).concat(chips);
    const hit = (a, b) => a.left < b.right - 0.5 && b.left < a.right - 0.5 && a.top < b.bottom - 0.5 && b.top < a.bottom - 0.5;
    ok(items.every((a, i) => items.every((b, j) => i >= j || !hit(a, b))), `${tag}: top row doesn't overlap`);
    ok(chips.every((c) => c.left >= row.left - 0.5 && c.right <= row.right + 0.5 && c.top < row.bottom), `${tag}: visible chips fit whole`);
    ok(items.every((b) => b.bottom <= sr.querySelector(".art").getBoundingClientRect().top + 1), `${tag}: plant below the top row`);
  };

  try {
    ok(customElements.get("cute-plant-card"), "custom element is defined");
    ok(window.customCards.some((c) => c.type === "cute-plant-card"), "registered in the card picker");

    const KINDS = ["generic", "monstera", "palm", "pothos", "fern", "snake", "succulent", "cactus", "herb", "flower"];
    for (const kind of KINDS)
      for (const days of [0, 3.5, 6.5, 12]) {
        const c = mount({ species: kind, sensors: ["sensor.m", "sensor.t"] }, hass(days));
        const sr = c.shadowRoot, art = sr.querySelector(".art");
        const tag = `${kind} @ ${days} d`;
        ok(art.querySelector("ellipse") instanceof SVGElement, `${tag}: art parsed as SVG`);
        ok(art.getBoundingClientRect().height > 50, `${tag}: art has room in a 3 × 2 tile`);
        ok(sr.querySelector(".chip").textContent.trim() !== "", `${tag}: chip text`);
        ok(sr.querySelectorAll(".bubble").length === 2, `${tag}: two sensor chips`);
        later.push(() => topRow(sr, tag)); // once laid out and the chips have been fitted
        ok(sr.querySelector("ha-card").getBoundingClientRect().height >= 112, `${tag}: card fills its tile`);
      }

    const c = mount({ species: "monstera" }, hass(3));
    ok(c.shadowRoot.querySelector("style").sheet.cssRules.length > 40, "stylesheet parsed");
    // check what is on screen, not just the attribute
    const shown = (el) => getComputedStyle(el).display !== "none" && el.getBoundingClientRect().height > 0;
    const box = c.shadowRoot.querySelector(".confirm");
    ok(!shown(box), "watering question not on screen at first");
    c._tap();
    ok(shown(box), "tap shows the watering question");
    c.shadowRoot.querySelector(".no").click();
    ok(!shown(box), "no closes the question");
    c._tap();
    c.shadowRoot.querySelector(".yes").click();
    ok(c._hass.calls[0]?.[1] === "press", "yes presses the button");
    ok(!shown(box), "yes closes the question");
    window.watered = c; // the can animation starts once the service call resolves

    const hot = mount({ species: "generic", sensors: ["sensor.t"] }, hass(12));
    ok(hot.shadowRoot.querySelector(".art .spin"), "scorched: the sun is out");

    const bubble = hot.shadowRoot.querySelector(".bubble");
    let info = null;
    hot.addEventListener("hass-more-info", (e) => (info = e.detail.entityId));
    bubble.click();
    ok(info === "sensor.t", "clicking a bubble opens its sensor");

    const named = mount({ species: "fern", name: "Hidden", show_name: false }, hass(1));
    ok(!shown(named.shadowRoot.querySelector(".name")), "show_name: false hides the name");
    const editor = customElements.get("cute-plant-card").getConfigElement();
    editor.setConfig({ entity: "input_button.p" });
    editor.hass = hass(1);
    const form = editor.querySelector("ha-form");
    ok(form && form.data.show_name === true && form.computeLabel({ name: "entity" }), "editor shows defaults as on");

    // a long name wraps instead of being cut, and the plant shrinks to fit
    const short = mount({ species: "monstera", name: "Monstera" }, hass(1));
    const long = mount({ species: "monstera", name: "Monstera deliciosa del salón grande" }, hass(1));
    const nm = long.shadowRoot.querySelector(".name").getBoundingClientRect();
    const artL = long.shadowRoot.querySelector(".art").getBoundingClientRect();
    const artS = short.shadowRoot.querySelector(".art").getBoundingClientRect();
    const cardL = long.shadowRoot.querySelector("ha-card").getBoundingClientRect();
    ok(nm.height >= 28, `long name wraps (${Math.round(nm.height)} px tall)`);
    ok(nm.height <= 46, "at most three lines");
    ok(artL.height < artS.height && artL.height > 25, `plant shrinks but stays visible (${Math.round(artL.height)} vs ${Math.round(artS.height)} px)`);
    ok(artL.bottom <= nm.top + 1 && nm.bottom <= cardL.bottom + 1, "plant, name and card don't overlap");
  } catch (e) {
    out.push(`FAIL exception: ${e.stack || e}`);
  }

  setTimeout(() => {
    later.forEach((f) => f());
    if (window.watered) ok(window.watered.shadowRoot.querySelector("ha-card").classList.contains("watering"), "yes plays the watering can");
    document.title = out.length && !out.some((l) => l.startsWith("FAIL")) ? "PASS" : "FAIL";
    const pre = document.createElement("pre");
    pre.id = "result";
    pre.textContent = out.join("\n");
    document.body.appendChild(pre);
  }, 500);
</script>
</body>
