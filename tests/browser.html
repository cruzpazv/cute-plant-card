<!doctype html>
<!--
  Smoke test in a real browser (CI runs it in headless Chrome):
    google-chrome --headless=new --virtual-time-budget=5000 --dump-dom file://$PWD/tests/browser.html
  The <title> ends up PASS or FAIL and #result lists every check.
-->
<meta charset="utf-8">
<title>RUNNING</title>
<style>.cell { width: 128px; height: 120px; display: inline-block; margin: 4px; }</style>
<script>
  const out = [];
  const ok = (cond, msg) => out.push(`${cond ? "PASS" : "FAIL"} ${msg}`);
  addEventListener("error", (e) => out.push(`FAIL uncaught: ${e.message}`));
  addEventListener("unhandledrejection", (e) => out.push(`FAIL unhandled rejection: ${e.reason}`));
</script>
<script src="../dist/cute-plant-card.js"></script>
<body>
<script>
  const D = 864e5, now = Date.now();
  const hass = (days, extra = {}) => ({
    states: {
      "input_button.p": { state: new Date(now - days * D).toISOString(), attributes: {}, last_changed: new Date().toISOString() },
      "sensor.m": { state: "12", attributes: { device_class: "moisture", unit_of_measurement: "%" } },
      "sensor.t": { state: "31.2", attributes: { device_class: "temperature", unit_of_measurement: "°C" } },
      ...extra,
    },
    entities: {}, locale: { language: "en" }, calls: [],
    callService(...a) { this.calls.push(a); return Promise.resolve(); },
  });
  const mount = (config, h) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    const card = document.createElement("cute-plant-card");
    card.setConfig({ entity: "input_button.p", ...config });
    card.hass = h;
    cell.appendChild(card);
    document.body.appendChild(cell);
    return card;
  };

  try {
    ok(customElements.get("cute-plant-card"), "custom element is defined");
    ok(window.customCards.some((c) => c.type === "cute-plant-card"), "registered in the card picker");

    const KINDS = ["generic", "monstera", "palm", "pothos", "fern", "snake", "succulent", "cactus", "herb", "flower"];
    for (const kind of KINDS)
      for (const days of [0, 3.5, 6.5, 12]) {
        const c = mount({ species: kind, sensors: ["sensor.m", "sensor.t"] }, hass(days));
        const sr = c.shadowRoot, art = sr.querySelector(".art");
        const tag = `${kind} @ ${days} d`;
        ok(art.querySelector("ellipse") instanceof SVGElement, `${tag}: art parsed as SVG`);
        ok(art.getBoundingClientRect().height > 50, `${tag}: art has room in a 3 × 2 tile`);
        ok(sr.querySelector(".chip").textContent.trim() !== "", `${tag}: chip text`);
        ok(sr.querySelectorAll(".bubble").length === 2, `${tag}: two sensor bubbles`);
        ok(sr.querySelector("ha-card").getBoundingClientRect().height >= 112, `${tag}: card fills its tile`);
      }

    const c = mount({ species: "monstera" }, hass(3));
    ok(c.shadowRoot.querySelector("style").sheet.cssRules.length > 40, "stylesheet parsed");
    ok(c.shadowRoot.querySelector(".confirm").hidden, "watering question hidden at first");
    c._tap();
    ok(!c.shadowRoot.querySelector(".confirm").hidden, "tap asks before watering");
    c.shadowRoot.querySelector(".yes").click();
    ok(c.shadowRoot.querySelector("ha-card").classList.contains("watering"), "yes plays the watering can");
    ok(c._hass.calls[0]?.[1] === "press", "yes presses the button");

    const hot = mount({ species: "generic", sensors: ["sensor.t"] }, hass(12));
    ok(hot.shadowRoot.querySelector(".art .spin"), "scorched: the sun is out");

    const bubble = hot.shadowRoot.querySelector(".bubble");
    let info = null;
    hot.addEventListener("hass-more-info", (e) => (info = e.detail.entityId));
    bubble.click();
    ok(info === "sensor.t", "clicking a bubble opens its sensor");

    const form = customElements.get("cute-plant-card").getConfigForm();
    ok(Array.isArray(form.schema) && form.computeLabel({ name: "entity" }), "editor form");
  } catch (e) {
    out.push(`FAIL exception: ${e.stack || e}`);
  }

  setTimeout(() => {
    document.title = out.length && !out.some((l) => l.startsWith("FAIL")) ? "PASS" : "FAIL";
    const pre = document.createElement("pre");
    pre.id = "result";
    pre.textContent = out.join("\n");
    document.body.appendChild(pre);
  }, 500);
</script>
</body>
